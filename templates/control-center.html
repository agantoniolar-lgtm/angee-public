<title>Control Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  control-center.html — the kit's control center page (T168).

  A private claude.ai Artifact with the `db`, `user` and `comments` capabilities. It holds no
  project data: everything it shows is read from the Artifact's database, written by the
  Claude session and by this page.

  Language: every visible text comes from STRINGS below (`en` and `es`). The page reads
  `meta/project` = { name, lang } — `lang` defaults to `en`; a variant (es-MX, es, Spanish,
  español, en-US…) maps to its table, and an unknown one falls back to English, said in the
  console only. A failed read of meta/project is said in a banner.
  This page is the kit's one exception to "the kit is English only": its language is asked
  per project the first time the control center is created.

  Schema: PAGE_SCHEMA below ('recorded-v1') says this page understands the `recorded` status.
  Every publish of the page writes that value into `meta/project` (T189 U12), so the session
  can tell a page that draws `recorded` cards as decided from an older one that would draw
  them as waiting, and writes `recorded` only on the first kind. The page itself never reads
  it back; it only sets it as `data-page-schema` on <html>.

  Collections read: only these. Since T189 the page shows decisions alone: no tasks, no agent
  reports, no load from the seed script.
    decisions/<id>  status open | decided | recorded | upcoming. `recorded` is a decided card
                    the session already wrote into the task log: drawn among the decided ones,
                    never as waiting and never under Upcoming, and never written by this page.
                    Before saving an answer the page reads the card again and writes only if it
                    is still `open`; otherwise it writes nothing and tells the owner the card was
                    already recorded. The live subscription asks only for `open`, `upcoming` and
                    `decided` (a `where status in`): `recorded` cards are not loaded when the page
                    opens. Each time the owner opens "Decided recently" the page reads the latest
                    10 `recorded` cards once, ordered by `decidedAt` (never by `order`, which an old
                    `legacy-pre-kit` card may lack), and shows them with the `decided` ones. Until
                    that read comes back its heading shows no count; a failed read is said as an
                    error, never as an empty list. "Upcoming" lists the `upcoming` cards of this
                    collection and nothing else. `kind: "action"` is an owner's action
                    (a command, a screen walk, a reading) with exact `steps`; anything else is
                    a decision card. The page writes `status/choice/note/decidedAt`, and the
                    drafts `draftChoice/draftNote/draftOther/draftAt` of a grouped decision;
                    `draftAt` is the time of the last draft write, one for the whole doc.
                    An open card starts from its draft only — never from an earlier `choice`
                    — and a draft older than its `decidedAt` (a reopened card) is ignored.
                    `logEntry` is written by the session, never by this page: the task-log
                    entry that recorded the card's decision, or `legacy-pre-kit` on an old
                    card of an adopted page, marked so it is never recorded. The page does
                    not read it.
    meta/project    { name, lang, … }: written by the session from `.ae-control-center` (see
                    Language above), plus the PAGE_SCHEMA marker on every publish. Any other
                    field is ignored.
    meta/notify     { threadId }: the one comment thread every notice to Claude reuses.
-->

<div id="app"></div>

<script>
(function () {
  'use strict';

  // What this template understands: the `recorded` status (header, "Schema"). The session
  // writes this value into meta/project on every publish; the page never reads it back.
  const PAGE_SCHEMA = 'recorded-v1';

  const own = (map, k) => (typeof k === 'string' && Object.prototype.hasOwnProperty.call(map, k) ? map[k] : null);

  // ─── Texts: every visible word of the page, per language ───
  const STRINGS = {
    en: {
      title: 'Control center',
      eyebrow: '{name} · control center',
      loading: 'Loading…',
      noDb: 'This page cannot read its data. Open it from claude.ai with your account.',
      lostConn: 'The connection to the data was lost ({code}). Reload the page.',
      projectError: 'Could not read the project settings ({code}); the page shows in English and without the project name. Reload the page.',

      noDecisions: 'Nothing waits on you. Everything that depended on you is settled.',
      klass: 'Class {k}',
      opened: 'Open since {time}',
      blocks: 'Blocks:', ifNot: 'If you don’t decide:',
      options: 'Options', recommended: 'recommended',
      other: 'Other', otherLabel: 'Your answer', otherPlaceholder: 'Write your answer',
      whyRec: 'Why the recommended one:',
      howHere: 'How we got here', fullTrace: 'Full trace: {ref}',
      note: 'Note (optional)', notePlaceholder: 'Your reason, if you want to leave one',
      register: 'Register decision',
      groupEyebrow: 'Group of {n} · sent together',
      groupProgress: '{a} of {n} answered',
      sendN: 'Send the {n} to Claude', send1: 'Send to Claude',
      draftSaved: 'Answer saved as a draft. It is sent with the group.',
      draftPending: 'Sent together with the rest of the group.',
      yourAction: 'Your action',
      actCommand: 'Run a command', actWalk: 'Walk through a screen', actRead: 'Read a document', actOther: 'Something to do',
      actDone: 'Done',
      upcoming: 'Upcoming', noUpcoming: 'Nothing else is lined up for you.',
      kindDecision: 'coming decision',
      decidedHead: 'Decided recently ({n})', decidedHeadBare: 'Decided recently', youChose: 'You chose: {x}', didIt: 'Done',
      historyEmpty: 'Nothing has been decided yet.',
      historyError: 'Could not read the recorded decisions ({code}). Close and open this list to try again.',
      suspect: 'suspicious time', suspectWhy: 'This time is in the future, so it was not written by the clock.',
      suspectNoZone: 'This time does not say its time zone, so no clock wrote it.',
      saving: 'Saving…', noPerm: 'You don’t have permission to register decisions on this page.',
      saveFail: 'Could not save ({code}). Try again.', saveFailId: 'Could not save {id} ({code}). Try again.',
      draftFail: 'Could not save the draft ({code}).',
      groupPartial: 'Could not save {id} ({code}). Saved and sent: {saved}. Try again for the rest.',
      alreadyRecorded: 'This card was already recorded, so your answer was not saved. To change it, ask Claude for a new card.',
      alreadyRecordedId: '{id} was already recorded, so nothing in this group was saved. Reload the page to see it.',
      alreadyRecordedPart: '{id} was already recorded and was not saved. Saved and sent: {saved}.',
      choiceGone: 'The options changed while you were answering; choose again.',
      toastSent: 'Saved and sent to Claude.',
      toastIdle: 'Saved. Claude is not listening right now; it will see it on its next check.',
      toastRate: 'Saved. Notices to Claude are paused for pace; it will see it on its next check.',
      toastFail: 'Saved. Could not notify Claude ({code}); it will see it on its next check.',
      toastNoChannel: 'Saved, but Claude was not notified: the notice channel did not load ({code}). It will see it on its next check.',
      noticeOne: 'Decision registered in the control center — {id} ({title}): {choice}.{note} Read the decisions collection and continue what it unblocks.',
      noticeGroup: 'Group of decisions registered in the control center — {title} ({n}): {lines}. Read the decisions collection and continue what it unblocks.',
      noticeNote: ' Note: {note}'
    },
    es: {
      title: 'Centro de control',
      eyebrow: '{name} · centro de control',
      loading: 'Cargando…',
      noDb: 'Esta página no puede leer sus datos. Ábrela desde claude.ai con tu cuenta.',
      lostConn: 'Se perdió la conexión con los datos ({code}). Recarga la página.',
      projectError: 'No se pudo leer la configuración del proyecto ({code}); la página sale en inglés y sin el nombre del proyecto. Recarga la página.',
      waiting: 'Esperan tu palabra',
      noDecisions: 'Nada espera tu palabra. Todo lo que dependía de ti está resuelto.',
      klass: 'Clase {k}',
      opened: 'Abierta desde {time}',
      blocks: 'Bloquea:', ifNot: 'Si no decides:',
      options: 'Opciones', recommended: 'recomendada',
      other: 'Otra', otherLabel: 'Tu respuesta', otherPlaceholder: 'Escribe tu respuesta',
      whyRec: 'Por qué la recomendada:',
      howHere: 'Cómo se llegó aquí', fullTrace: 'Traza completa: {ref}',
      note: 'Nota (opcional)', notePlaceholder: 'Tu razón, si quieres dejarla',
      register: 'Registrar decisión',
      groupEyebrow: 'Grupo de {n} · se envían juntas',
      groupProgress: '{a} de {n} respondidas',
      sendN: 'Enviar las {n} a Claude', send1: 'Enviar a Claude',
      draftSaved: 'Respuesta guardada como borrador. Se envía con el grupo.',
      draftPending: 'Se envía junto con el resto del grupo.',
      yourAction: 'Acción tuya',
      actCommand: 'Correr un comando', actWalk: 'Recorrer una pantalla', actRead: 'Leer un documento', actOther: 'Algo por hacer',
      actDone: 'Ya lo hice',
      upcoming: 'Próximas', noUpcoming: 'Nada más en fila para ti.',
      kindDecision: 'decisión próxima',
      decidedHead: 'Decididas recientemente ({n})', decidedHeadBare: 'Decididas recientemente', youChose: 'Elegiste: {x}', didIt: 'Hecha',
      historyEmpty: 'Todavía no hay nada decidido.',
      historyError: 'No se pudieron leer las decisiones registradas ({code}). Cierra y abre esta lista para intentarlo de nuevo.',
      suspect: 'hora sospechosa', suspectWhy: 'Esta hora cae en el futuro: no la escribió el reloj.',
      suspectNoZone: 'Esta hora no dice su zona horaria: no la escribió un reloj.',
      saving: 'Guardando…', noPerm: 'No tienes permiso para registrar decisiones en esta página.',
      saveFail: 'No se pudo guardar ({code}). Intenta de nuevo.', saveFailId: 'No se pudo guardar {id} ({code}). Intenta de nuevo.',
      draftFail: 'No se pudo guardar el borrador ({code}).',
      groupPartial: 'No se pudo guardar {id} ({code}). Guardadas y enviadas: {saved}. Intenta de nuevo con el resto.',
      alreadyRecorded: 'Esta tarjeta ya estaba registrada, así que tu respuesta no se guardó. Para cambiarla, pídele a Claude una tarjeta nueva.',
      alreadyRecordedId: '{id} ya estaba registrada, así que no se guardó nada de este grupo. Recarga la página para verla.',
      alreadyRecordedPart: '{id} ya estaba registrada y no se guardó. Guardadas y enviadas: {saved}.',
      choiceGone: 'Las opciones cambiaron mientras respondías; elige de nuevo.',
      toastSent: 'Guardado y enviado a Claude.',
      toastIdle: 'Guardado. Claude no está escuchando ahora; lo verá en su siguiente revisión.',
      toastRate: 'Guardado. Aviso a Claude en pausa por ritmo; lo verá en su siguiente revisión.',
      toastFail: 'Guardado. No se pudo avisar a Claude ({code}); lo verá en su siguiente revisión.',
      toastNoChannel: 'Guardado, pero no se avisó a Claude: el canal de avisos no cargó ({code}). Lo verá en su siguiente revisión.',
      noticeOne: 'Decisión registrada en el control center — {id} ({title}): {choice}.{note} Lee la colección decisions y continúa lo que desbloquea.',
      noticeGroup: 'Grupo de decisiones registrado en el control center — {title} ({n}): {lines}. Lee la colección decisions y continúa lo que desbloquea.',
      noticeNote: ' Nota: {note}'
    }
  };
  const LOCALES = { en: 'en-US', es: 'es-MX' };

  // ─── State ───
  let lang = 'en';
  let project = {};
  let decisions = [];
  let projectError = null;
  let db = null, comments = null, commentsError = null, commentsP = null, readOnly = false;
  let loadError = null;
  // The live subscription leaves `recorded` cards out; the history reads them on demand.
  const LIVE_STATUSES = ['open', 'upcoming', 'decided'];
  const HISTORY_SHOWN = 10;
  let history = { state: 'idle', docs: [], code: null }; // idle | loading | ok | error
  let historySeq = 0;
  const drafts = {};
  const groupUi = {};

  // `meta/project.lang` may arrive as a variant: es-MX, es, Spanish, español, en-US… Each maps
  // to one of the two tables; anything else falls back to English and says so in the console
  // only (the owner sees the page, not a warning about it). Read as own keys only, so a value
  // like `constructor` never reaches the tables or Intl.
  const LANG_ALIASES = { es: 'es', spanish: 'es', 'español': 'es', espanol: 'es', castellano: 'es', en: 'en', english: 'en', 'inglés': 'en', ingles: 'en' };
  let warnedLang = null;
  function normLang(v) {
    if (v == null || v === '') return 'en';
    const s = typeof v === 'string' ? v.trim().toLowerCase().replace(/_/g, '-') : '';
    const base = s.split('-')[0];
    const hit = own(LANG_ALIASES, s) || own(LANG_ALIASES, base);
    if (hit) return hit;
    if (warnedLang !== String(v)) { warnedLang = String(v); try { console.warn('control center: unknown language "' + String(v) + '"; showing English.'); } catch (e) {} }
    return 'en';
  }

  function t(key, vars) {
    const table = STRINGS[lang] || STRINGS.en;
    let s = table[key] != null ? table[key] : (STRINGS.en[key] != null ? STRINGS.en[key] : key);
    if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] != null ? String(vars[k]) : m));
    return s;
  }

  // ─── DOM helpers ───
  const PROPS = { checked: 1, disabled: 1, value: 1, hidden: 1, open: 1 };
  function el(tag, attrs) {
    const n = document.createElement(tag);
    if (attrs) for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else if (PROPS[k]) n[k] = v;
      else n.setAttribute(k, v === true ? '' : String(v));
    }
    const kids = Array.prototype.slice.call(arguments, 2);
    appendKids(n, kids);
    return n;
  }
  function appendKids(n, kids) {
    for (const k of kids) {
      if (k == null || k === false) continue;
      if (Array.isArray(k)) appendKids(n, k);
      else n.append(k.nodeType ? k : document.createTextNode(String(k)));
    }
  }
  // replaceChildren without the browser's habit of printing a null as "null".
  function put(parent) {
    const kids = []; (function flat(a) { for (const k of a) { if (k == null || k === false || k === '') continue; if (Array.isArray(k)) flat(k); else kids.push(k); } })(Array.prototype.slice.call(arguments, 1));
    parent.replaceChildren.apply(parent, kids);
  }
  // `text with code` → text and <code>, so a command in a step is shown as one.
  function rich(s) {
    return String(s).split(/(`[^`]+`)/).filter(Boolean).map(p => p[0] === '`' && p.length > 2 ? el('code', null, p.slice(1, -1)) : p);
  }
  // A list field that arrives as a string (seen in an installed project) is read one item per line.
  function asList(v) {
    if (Array.isArray(v)) return v.filter(x => x != null && String(x).trim() !== '').map(String);
    if (typeof v === 'string') return v.split(/\r?\n/).map(s => s.replace(/^\s*[-*•]\s*/, '').trim()).filter(Boolean);
    return [];
  }
  function asOptions(v) {
    if (!Array.isArray(v)) return [];
    return v.filter(o => o && typeof o === 'object' && o.id != null && o.id !== 'other');
  }

  // ─── Time: shown in the page's language; a time no clock wrote is marked as suspicious ───
  // Every time the session and this page write names its zone. So the rule, the same for
  // every time on the page (open, upcoming and decided cards):
  //   - a time ahead of this clock by more than SKEW_MS (2 minutes, for two clocks that
  //     disagree a little) is suspicious: no clock wrote it;
  //   - a time with no zone — a bare date included — is suspicious wherever it falls: the
  //     script did not write it, and a time typed by hand is the one that once landed in the
  //     future (T116). There is no tolerance for another zone.
  const SKEW_MS = 2 * 60000;
  function parseTime(v) {
    if (v == null || v === '') return null;
    if (typeof v === 'number') return Number.isFinite(v) ? { ms: v, dateOnly: false, zoned: true } : null;
    const s = String(v).trim();

    });
    put(root, el('div', { class: 'block' }, f.waitH, f.waitList, f.waitEmpty), f.act, el('div', { class: 'block' }, f.upH, f.upRows, f.upEmpty), f.dec);
    // Typing state: a card being typed in is never rebuilt; once the focus leaves it, what waited is applied.
    root.addEventListener('compositionstart', () => { composing = true; });
    root.addEventListener('compositionend', () => { composing = false; });
    root.addEventListener('focusout', e => {
      if (!deferred) return;
      focusOverride = e.relatedTarget || null;
      try { render(); } finally { focusOverride = null; }
    });
    return (dv = f);
  }

  function renderDecisions(root) {
    const f = frame(root);
    deferred = false;
    const open = decisions.filter(d => d.status === 'open');
    const cards = open.filter(d => d.kind !== 'action');
    const actions = open.filter(d => d.kind === 'action');
    const out = []; const seen = new Set(); const live = new Set();
    for (const d of cards) {
      if (d.group) {
        if (seen.has(d.group)) continue;
        seen.add(d.group);
        const members = cards.filter(x => x.group === d.group);
        const gkey = 'g:' + d.group;
        const head = members.map(m => ({ id: m.id, task: m.task, groupTitle: m.groupTitle, groupWhy: m.groupWhy }));
        const block = cached(gkey, head, () => groupBlock(d.group, members));
        live.add(gkey);
        const memberNodes = members.map(m => { live.add(m.id); return cached(m.id, m, () => decisionCard(m)); });
        reconcile(block.__members, memberNodes);
        out.push(block);
      } else { live.add(d.id); out.push(cached(d.id, d, () => decisionCard(d))); }
    }
    const actionNodes = actions.map(d => { live.add(d.id); return cached(d.id, d, () => actionCard(d)); });
    for (const k of Array.from(cardCache.keys())) if (!live.has(k)) { cardCache.delete(k); delete ui[k]; }
    Object.keys(ui).forEach(k => ui[k].refresh());

    f.waitH.textContent = t('waiting');
    reconcile(f.waitList, out);
    f.waitList.hidden = !out.length;
    f.waitEmpty.hidden = !!out.length;
    f.waitEmpty.textContent = loadError ? t('lostConn', { code: loadError }) : t('noDecisions');

    f.actH.textContent = t('yourAction');
    reconcile(f.actList, actionNodes);
    f.act.hidden = !actionNodes.length;

    // Upcoming is the `upcoming` cards of decisions, nothing else. They come in the same
    // subscription as the open ones, so a failed read is the lost connection said above.
    const coming = decisions.filter(d => d.status === 'upcoming');
    f.upH.textContent = t('upcoming');
    put(f.upRows, coming.map(upcomingRow));
    f.upRows.hidden = !coming.length;
    f.upEmpty.hidden = !!coming.length;
    f.upEmpty.textContent = t('noUpcoming');

    // `recorded` is a decided card already in the task log: shown here like any decided one,
    // once the history read brought it. The live `decided` cards win over a copy from that read.
    const liveDecided = decisions.filter(d => d.status === 'decided');
    const liveIds = new Set(liveDecided.map(d => d.id));
    const past = history.docs.filter(d => d.status === 'recorded' && !liveIds.has(d.id));
    const decided = liveDecided.concat(past)
      .sort((a, b) => String(b.decidedAt || '').localeCompare(String(a.decidedAt || ''))).slice(0, HISTORY_SHOWN);
    // A count only once the recorded cards are in: before that it would be a false number.
    f.decSum.textContent = history.state === 'ok' ? t('decidedHead', { n: decided.length }) : t('decidedHeadBare');
    const hMsg = history.state === 'loading' ? t('loading')
      : history.state === 'error' ? t('historyError', { code: history.code })
      : history.state === 'ok' && !decided.length ? t('historyEmpty') : '';
    f.decMsg.textContent = hMsg;
    f.decMsg.hidden = !hMsg;
    f.decMsg.className = history.state === 'error' ? 'empty error' : 'empty';
    if (history.state === 'error') f.decMsg.setAttribute('role', 'alert'); else f.decMsg.removeAttribute('role');
    put(f.decRows, decided.map(d => el('div', { class: 'row' },
      el('span', null, el('b', null, d.title || d.question || d.id), ' — ', t('youChose', { x: choiceLabel(d, d.choice) }), d.note ? ' · ' + d.note : ''),
      el('span', { class: 'row-side' }, timeEl(d.decidedAt)))));
    f.decRows.hidden = !decided.length;
    // Always shown: whether recorded cards exist is known only once the history is opened.
    f.dec.hidden = false;
  }
  // One bounded read of the latest recorded cards, by `decidedAt` — not by `order`, which an
  // old `legacy-pre-kit` card may not have. Only the latest call's answer is kept.
  function loadHistory() {
    if (!db) return;
    const seq = ++historySeq;
    history = { state: 'loading', docs: history.docs, code: null };
    render();
    Promise.resolve()
      .then(() => db.collection('decisions').where('status', '==', 'recorded').orderBy('decidedAt', 'desc').limit(HISTORY_SHOWN).get())
      .then(snap => {
        if (seq !== historySeq) return;
        history = { state: 'ok', docs: snap.docs.map(s => Object.assign({ id: s.id }, s.data())), code: null };
        render();
      }, e => {
        if (seq !== historySeq) return;
        history = { state: 'error', docs: [], code: (e && e.code) || 'error' };
        render();
      });
  }

  // ─── Shell: one view, the decisions ───
  const app = document.getElementById('app');
  const eyebrowEl = el('div', { class: 'eyebrow' });
  const bannerEl = el('div', { class: 'banner', role: 'alert', hidden: true });
  const panel = el('section', { class: 'view', id: 'view-decisions' }, el('div', { class: 'empty' }, t('loading')));
  put(app, el('div', { class: 'wrap' },
    el('header', null, el('div', { class: 'topline' }, eyebrowEl), bannerEl),
    panel));

  function renderShell() {
    const name = project.name || '';
    document.documentElement.setAttribute('lang', lang);
    document.documentElement.setAttribute('data-page-schema', PAGE_SCHEMA);
    document.title = name ? name + ' · ' + t('title') : t('title');
    eyebrowEl.textContent = name ? t('eyebrow', { name }) : t('title');
    bannerEl.hidden = !projectError;
    bannerEl.textContent = projectError ? t('projectError', { code: projectError }) : '';
  }
  function render() {
    renderShell();
    if (db) renderDecisions(panel);
  }
  renderShell();

  // ─── Runtime ───
  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (!db) { put(panel, el('div', { class: 'empty' }, t('noDb'))); return; }
    // A notice waits for this, so a click before it loads is not taken for "no channel".
    commentsP = Promise.resolve().then(() => window.claude.use('comments')).then(
      c => { comments = c || null; if (!comments) commentsError = 'unavailable'; return comments; },
      e => { commentsError = (e && e.code) || 'unavailable'; return null; });
    try {
      const user = await window.claude.use('user');
      if (user && user.can && (await user.can('data.write')) === false) readOnly = true;
    } catch (e) {}
    const docs = snap => snap.docs.map(s => Object.assign({ id: s.id }, s.data()));
    db.doc('meta/project').onSnapshot(s => {
      project = s.exists ? (s.data() || {}) : {};
      lang = normLang(project.lang);
      projectError = null;
      render();
    }, err => { projectError = (err && err.code) || 'error'; render(); });
    db.collection('decisions').where('status', 'in', LIVE_STATUSES).orderBy('order').onSnapshot(snap => {
      const before = decisions.filter(d => d.status === 'decided').map(d => d.id);
      decisions = docs(snap); loadError = null;
      // A decided card that left the subscription was most likely recorded: an open history reads again.
      const now = new Set(decisions.filter(d => d.status === 'decided').map(d => d.id));
      if (openDetails.has('decided') && before.some(id => !now.has(id))) loadHistory();
      render();
    }, err => { loadError = (err && err.code) || 'error'; render(); });
  })();
})();
</script>
